# Gated behind v-tags; costs nothing until first release at Phase 2
# completion (docs/19 §8).

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: station-app-${{ matrix.os }}
          path: target/release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Draft release with notes generated from conventional commits.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
